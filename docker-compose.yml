services:
  # ========================================================
  # 1. DATABASE SERVICE (MySQL 8.0)
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: smart_library_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-smart_library}
    ports:
      - "${DB_EXTERNAL_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - library_net

  # ========================================================
  # 2. BACKEND API SERVICE (Node.js Express)
  # ========================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart_library_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-smart_library}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:-smart_library_secret_key_2026_super_secure}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - library_net

  # ========================================================
  # 3. FRONTEND WEB SERVICE (React Vite + Nginx)
  # ========================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart_library_client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - library_net

# ========================================================
# VOLUMES & NETWORKS
# ========================================================
volumes:
  db_data:
    name: smart_library_db_data

networks:
  library_net:
    name: smart_library_network
    driver: bridge
