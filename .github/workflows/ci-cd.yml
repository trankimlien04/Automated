name: Smart Library CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: Backend Check & Verification
  # ========================================================
  server-ci:
    name: Backend Lint & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Validate Backend Code Syntax
        run: |
          cd server
          node -c index.js
          node -c config/db.js
          node -c config/initDb.js
          echo "Backend syntax validation passed successfully."

  # ========================================================
  # JOB 2: Frontend Build & Typecheck
  # ========================================================
  client-ci:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd client
          npm run build

  # ========================================================
  # JOB 3: Docker Build & Compose Verification
  # ========================================================
  docker-build:
    name: Docker Image Build & Validation
    runs-on: ubuntu-latest
    needs: [server-ci, client-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: smart-library-server:latest

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: smart-library-client:latest

  # ========================================================
  # JOB 4: Automated Deployment (CD to VPS / Server)
  # ========================================================
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: "${{ env.SSH_HOST != '' }}"
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "Starting deployment on production server..."
            cd /opt/smart-library || cd ~/smart-library
            git pull origin main || git pull origin master
            docker compose down
            docker compose up -d --build
            docker compose ps
            echo "Smart Library 4.0 successfully deployed!"
